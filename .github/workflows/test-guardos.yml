name: Android Interactive Playground (Ultra Fast x86_64)

on:
  push:
    paths:
      - 'GuardOS_system.sh'
  pull_request:
  workflow_dispatch:

jobs:
  test-on-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Hardware Virtualization (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Ultra Fast Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "Waiting for fast boot (2-4 minutes)..."
            adb wait-for-device
            
            echo "Requesting Root Access..."
            adb root
            sleep 3
            adb wait-for-device
            
            echo "Waiting for boot to complete..."
            for i in $(seq 1 60); do if adb shell getprop sys.boot_completed | grep -q 1; then break; fi; sleep 2; done
            
            echo "Preparing Perfect Environment..."
            wget -qO busybox https://busybox.net/downloads/binaries/1.31.0-defconfig-multiarch-musl/busybox-x86_64
            adb push busybox /data/local/tmp/
            adb shell chmod +x /data/local/tmp/busybox
            
            adb push GuardOS_system.sh /data/local/tmp/
            adb shell chmod +x /data/local/tmp/GuardOS_system.sh
            
            # إصلاح مسارات الحماية
            adb shell "sed -i 's/remount_rw ||/true ||/g' /data/local/tmp/GuardOS_system.sh"
            adb shell "sed -i 's|/system/bin|/data/local/tmp|g' /data/local/tmp/GuardOS_system.sh"
            adb shell "sed -i 's|/data/local/tmp/sh|/system/bin/sh|g' /data/local/tmp/GuardOS_system.sh"
            adb shell "sed -i 's|find_bb() {|find_bb() {\n  echo \"/data/local/tmp/busybox\"\n  return 0|g' /data/local/tmp/GuardOS_system.sh"
            
            # 🌟 الخدعة السحرية: نجعل السكربت يحمل ملفات x86_64 ليعمل بسرعة البرق وبشكل متكامل!
            adb shell "sed -i 's/armhf)/armhf|x86_64)/g' /data/local/tmp/GuardOS_system.sh"
            adb shell "sed -i 's/ROOTFS_ARCH=\"armhf\"/ROOTFS_ARCH=\"x86_64\"/g' /data/local/tmp/GuardOS_system.sh"
            adb shell "sed -i 's/UBUNTU_ARCH=\"armhf\"/UBUNTU_ARCH=\"amd64\"/g' /data/local/tmp/GuardOS_system.sh"
            
            # اختصار install
            adb shell "echo 'alias install=\"sh /data/local/tmp/GuardOS_system.sh\"' > /data/local/tmp/env.sh"
            
            echo "==========================================================="
            echo " BUILDING WEB TERMINAL SERVER... "
            echo "==========================================================="
            wget -qO ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
            chmod +x ttyd
            sudo mv ttyd /usr/local/bin/
            
            ttyd -W -p 8080 adb shell -t "ENV=/data/local/tmp/env.sh sh" &
            
            ssh-keygen -t rsa -f ~/.ssh/id_rsa -q -N ""
            ssh -o StrictHostKeyChecking=no -R 80:localhost:8080 nokey@localhost.run -T -n > /tmp/url.txt 2>&1 &
            
            sleep 10
            echo ""
            echo "==========================================================="
            echo "🔗 اضغط على الرابط بالأسفل لتدخل إلى شاشة الأندرويد السريعة 🔗"
            grep -o "https://[a-zA-Z0-9.-]*\.lhr\.life" /tmp/url.txt
            echo "==========================================================="
            echo "1. للنسخ واللصق: كليك يمين ثم Paste"
            echo "2. اكتب كلمة:  install  ومبروك التثبيت الشامل!"
            echo "==========================================================="
            
            sleep 7200
