name: Android Interactive Playground

on:
  push:
    paths:
      - 'GuardOS_system.sh'
  pull_request:
  workflow_dispatch:

jobs:
  test-on-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Hardware Virtualization (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android Emulator and Web Terminal
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "Waiting for device to be online..."
            adb wait-for-device
            
            echo "Requesting Root Access..."
            adb root
            sleep 3
            adb wait-for-device
            
            echo "Waiting for boot to complete..."
            for i in $(seq 1 60); do if adb shell getprop sys.boot_completed | grep -q 1; then echo "Device Ready!"; break; fi; sleep 2; done
            
            echo "Pushing script to Android device..."
            adb push GuardOS_system.sh /data/local/tmp/
            adb shell chmod +x /data/local/tmp/GuardOS_system.sh
            
            echo "==========================================================="
            echo " MAGIC BACKDOOR ACTIVATED - PREPARING WEB TERMINAL "
            echo "==========================================================="
            sudo apt-get update -qq
            sudo apt-get install -y tmate -qq
            
            # إنتاج مفتاح تشفير وهمي ليعمل الاتصال
            ssh-keygen -t rsa -f ~/.ssh/id_rsa -q -N ""
            
            # تشغيل السيرفر السري
            tmate -S /tmp/tmate.sock new-session -d
            tmate -S /tmp/tmate.sock wait tmate-ready
            
            echo ""
            echo "==========================================================="
            echo "🔗 اضغط على الرابط بالأسفل لتدخل إلى شاشة الأندرويد من متصفحك 🔗"
            tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
            echo "==========================================================="
            echo "1. بمجرد أن تفتح الرابط، اكتب أمر: adb shell"
            echo "2. الآن أنت داخل الأندرويد! لتشغيل السكربت بيدك اكتب:"
            echo "   sh /data/local/tmp/GuardOS_system.sh"
            echo ""
            echo "ملاحظة: السيرفر سيبقى مفتوحاً لك لمدة ساعة كاملة."
            echo "==========================================================="
            
            # إيقاف مؤقت للسيرفر لمدة ساعة لكي تلعب براحتك!
            sleep 3600
