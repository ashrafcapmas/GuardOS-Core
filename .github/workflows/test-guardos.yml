name: Android Interactive Playground

on:
  push:
    paths:
      - 'GuardOS_system.sh'
  pull_request:
  workflow_dispatch:

jobs:
  test-on-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Hardware Virtualization (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android Emulator and Web Terminal
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "Waiting for device to be online..."
            adb wait-for-device
            
            echo "Requesting Root Access..."
            adb root
            sleep 3
            adb wait-for-device
            
            echo "Waiting for boot to complete..."
            for i in $(seq 1 60); do if adb shell getprop sys.boot_completed | grep -q 1; then break; fi; sleep 2; done
            
            echo "Pushing script to Android device..."
            adb push GuardOS_system.sh /data/local/tmp/
            adb shell chmod +x /data/local/tmp/GuardOS_system.sh
            
            echo "==========================================================="
            echo " BUILDING WEB TERMINAL SERVER... "
            echo "==========================================================="
            # تحميل سيرفر الويب الخاص بالشاشة
            wget -qO ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
            chmod +x ttyd
            sudo mv ttyd /usr/local/bin/
            
            # تشغيل السيرفر في الخلفية
            ttyd -p 8080 bash &
            
            # إنشاء نفق سري للإنترنت
            ssh-keygen -t rsa -f ~/.ssh/id_rsa -q -N ""
            ssh -o StrictHostKeyChecking=no -R 80:localhost:8080 nokey@localhost.run -T -n > /tmp/url.txt 2>&1 &
            
            sleep 10
            echo ""
            echo "==========================================================="
            echo "🔗 اضغط على الرابط بالأسفل لتدخل إلى شاشة الأندرويد من متصفحك 🔗"
            grep -o "https://[a-zA-Z0-9.-]*\.lhr\.life" /tmp/url.txt
            echo "==========================================================="
            echo "1. سيفتح لك موقع، اضغط فيه على الزر الأزرق للموافقة على الدخول."
            echo "2. ستظهر لك الشاشة السوداء، اكتب فيها: adb shell"
            echo "3. لتشغيل سكربت GuardOS بيدك اكتب:"
            echo "   sh /data/local/tmp/GuardOS_system.sh"
            echo "==========================================================="
            
            # إيقاف مؤقت للسيرفر لمدة ساعة لكي تلعب براحتك!
            sleep 3600
